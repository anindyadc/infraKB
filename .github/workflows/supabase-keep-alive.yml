name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC every day to prevent project pausing
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          # We use the REST API to perform a simple query which keeps the project active
          # Supabase pauses free projects after 1 week of inactivity.
          curl -s -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
          -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
          -o /dev/null -w "Status Code: %{http_code}\n"
