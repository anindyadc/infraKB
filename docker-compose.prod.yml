services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: infrakb
      MYSQL_USER: infrakb
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_prod_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://infrakb:${DB_PASSWORD:-secret}@db:3306/infrakb
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 4000
      NODE_ENV: production
    volumes:
      - uploads_prod_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_prod_data:
  uploads_prod_data:
